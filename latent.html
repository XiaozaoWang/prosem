<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LATENT.SYS</title>
<style>
  :root { --paper:#ecebe3; --ink:#141414; --mid:#9a998f; }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body {
    background:
      conic-gradient(#d9d8cf 25%, #ecebe3 0 50%, #d9d8cf 0 75%, #ecebe3 0) 0 0/4px 4px;
    color:var(--ink);
    font:13px/1.45 ui-monospace,"SF Mono",Menlo,"Courier New",monospace;
    min-height:100vh; padding:28px 16px 40px;
  }
  .menubar {
    max-width:1120px; margin:0 auto 18px; display:flex; gap:22px; align-items:center;
    background:var(--paper); border:2px solid var(--ink); padding:3px 12px; font-weight:bold;
  }
  .menubar .sp { flex:1; }
  .menubar span.dim { font-weight:normal; color:#555; }
  .win {
    max-width:1120px; margin:0 auto; background:var(--paper);
    border:2px solid var(--ink); box-shadow:6px 6px 0 var(--ink);
  }
  .title {
    height:22px; border-bottom:2px solid var(--ink); text-align:center; position:relative;
    background:repeating-linear-gradient(var(--ink) 0 2px, transparent 2px 4px) 0 4px/100% 14px no-repeat;
  }
  .title b { background:var(--paper); padding:0 12px; position:relative; top:1px; letter-spacing:.12em; }
  .title i { position:absolute; left:8px; top:4px; width:12px; height:12px; border:2px solid var(--ink); background:var(--paper); }
  .epigraph { padding:12px 16px 10px; border-bottom:2px solid var(--ink); display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .epigraph em { font-style:normal; letter-spacing:.04em; }
  .epigraph small { color:#555; }
  .main { display:grid; grid-template-columns:1fr 262px; }
  .stage { border-right:2px solid var(--ink); position:relative; min-width:0; }
  canvas#field { display:block; width:100%; cursor:crosshair; }
  .side { padding:14px; display:flex; flex-direction:column; gap:12px; }
  #out { width:100%; aspect-ratio:1; image-rendering:pixelated; border:2px solid var(--ink); background:var(--paper); display:block; }
  .read { border-top:2px solid var(--ink); padding-top:8px; font-size:12px; }
  .read div { display:flex; justify-content:space-between; gap:8px; }
  .read div span:first-child { color:#555; }
  .read div span:last-child { text-align:right; word-break:break-all; }
  .verdict { min-height:2.9em; font-weight:bold; }
  .ctrl { border-top:2px solid var(--ink); padding:10px 16px; display:flex; flex-wrap:wrap; gap:14px 24px; align-items:center; }
  .seg { display:inline-flex; border:2px solid var(--ink); box-shadow:3px 3px 0 var(--ink); }
  .seg button { font:inherit; font-weight:bold; background:var(--paper); color:var(--ink); border:0; padding:5px 14px; cursor:pointer; letter-spacing:.08em; }
  .seg button + button { border-left:2px solid var(--ink); }
  .seg button.on { background:var(--ink); color:var(--paper); }
  .dimbox { display:flex; align-items:center; gap:10px; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:170px; height:12px; background:
      repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 34px) 0 100%/100% 6px no-repeat,
      linear-gradient(var(--ink),var(--ink)) 0 3px/100% 2px no-repeat; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:18px; background:var(--paper); border:2px solid var(--ink); cursor:ew-resize; }
  input[type=range]::-moz-range-thumb { width:8px; height:14px; background:var(--paper); border:2px solid var(--ink); border-radius:0; cursor:ew-resize; }
  #dimv { display:inline-block; min-width:7ch; font-weight:bold; }
  .prompt { border-top:2px solid var(--ink); padding:12px 16px; }
  .prompt form { display:flex; gap:10px; align-items:center; }
  .prompt label { font-weight:bold; }
  .prompt input[type=text] { flex:1; font:inherit; background:transparent; color:var(--ink); border:0; border-bottom:2px solid var(--ink); padding:4px 2px; outline:none; caret-color:var(--ink); min-width:0; }
  .prompt input[type=text]:focus { background:#dcdbd1; }
  button.go { font:inherit; font-weight:bold; background:var(--paper); border:2px solid var(--ink); box-shadow:3px 3px 0 var(--ink); padding:4px 12px; cursor:pointer; color:var(--ink); }
  button.go:active { box-shadow:none; transform:translate(3px,3px); background:var(--ink); color:var(--paper); }
  .chips { margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; }
  .chips button { font:inherit; font-size:12px; background:transparent; border:1px solid var(--ink); color:var(--ink); padding:1px 8px; cursor:pointer; }
  .chips button:hover { background:var(--ink); color:var(--paper); }
  .status { border-top:2px solid var(--ink); padding:7px 16px; display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; background:var(--ink); color:var(--paper); }
  .status .blink::after { content:"█"; animation:b 1s steps(1) infinite; margin-left:4px; }
  @keyframes b { 50% { opacity:0; } }
  .foot { max-width:1120px; margin:14px auto 0; color:#555; font-size:11px; }
  @media (max-width:820px) {
    .main { grid-template-columns:1fr; }
    .stage { border-right:0; border-bottom:2px solid var(--ink); }
    .side { flex-direction:row; flex-wrap:wrap; }
    .side > * { flex:1 1 220px; }
    #out { max-width:220px; }
  }
</style>
</head>
<body>

<div class="menubar">
  <span>◼ LATENT.SYS</span><span>File</span><span>Edit</span><span>Probe</span>
  <span class="sp"></span><span class="dim" id="clock">--:--</span>
</div>

<div class="win">
  <div class="title"><i></i><b>A THEORY OF LATENT SPACES</b></div>

  <div class="main">
    <div class="stage"><canvas id="field"></canvas></div>
    <div class="side">
      <canvas id="out" width="48" height="48"></canvas>
      <div class="verdict" id="verdict">— no output —</div>
      <div class="read">
        <div><span>MODE</span><span id="r-mode">ARCHIVE</span></div>
        <div><span>DIMENSIONS</span><span id="r-dim">3</span></div>
        <div><span>PROBE</span><span id="r-probe">—</span></div>
        <div><span>NEAR</span><span id="r-near">0</span></div>
        <div><span>HOVER</span><span id="r-hover">—</span></div>
      </div>
    </div>
  </div>

  <div class="ctrl">
    <div class="seg" role="group" aria-label="mode">
      <button id="bA" class="on">ARCHIVE</button><button id="bL">LATENT</button>
    </div>
    <div class="dimbox">
      <span>DIM</span><input id="dim" type="range" min="0" max="5" step="1" value="0"><span id="dimv">3</span>
    </div>
  </div>

  <div class="prompt">
    <form id="f"><label for="q">&gt;</label>
      <input id="q" type="text" autocomplete="off" spellcheck="false">
      <button class="go" type="submit">ENTER</button>
    </form>
    <div class="chips" id="chips"></div>
  </div>

  <div class="status"><span id="msg" class="blink"></span><span id="cnt"></span></div>
</div>


<script>
(() => {
  const $ = id => document.getElementById(id);
  const TAGS = ['face','sea','war','street','mirror','body','city','night','film','window','hand','tree','sky','crowd','door','light'];
  const ZH = {'脸':'face','海':'sea','战争':'war','街':'street','镜':'mirror','身体':'body','城':'city','夜':'night','电影':'film','窗':'window','手':'hand','树':'tree','天':'sky','人群':'crowd','门':'door','光':'light'};
  const DIMS = [3, 8, 64, 768, 4096, 12288];
  const COLS = 32, ROWS = 16;

  function rng(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  function hash(s){ let h=2166136261; for (const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
  const gauss = r => (r()+r()+r()+r()-2)*1.2;

  // --- data: 512 records, each with an archive slot and a latent position ---
  const R = rng(1955);
  const centers = TAGS.map(() => [0.14 + R()*0.72, 0.14 + R()*0.72]);
  const pts = [];
  TAGS.forEach((tag, ti) => {
    for (let i = 0; i < COLS; i++) {
      const mix = R() < 0.22 ? (R()*TAGS.length|0) : ti;
      const m = R()*0.5, c1 = centers[ti], c2 = centers[mix];
      const bx = c1[0]*(1-m)+c2[0]*m, by = c1[1]*(1-m)+c2[1]*m;
      pts.push({
        tag, ti, i,
        ax: 0.13 + 0.84*i/(COLS-1), ay: 0.07 + 0.87*ti/(ROWS-1),
        lx: Math.min(.97,Math.max(.03, bx + gauss(R)*0.055)),
        ly: Math.min(.97,Math.max(.03, by + gauss(R)*0.055)),
        id: 'ARC-' + tag.slice(0,3).toUpperCase() + '-' + String(i+1).padStart(3,'0'),
        ph: R()*6.283
      });
    }
  });

  // --- state ---
  let target = 0, t = 0, dimIdx = 0;
  let probe = null;           // latent probe {x,y}
  let query = '', matched = []; // archive match: tag indices
  let hover = -1, selected = -1;
  let revealTimer = null;
  const ink = '#141414', paper = '#ecebe3';

  // --- canvas ---
  const cv = $('field'), ctx = cv.getContext('2d');
  let W = 600, H = 340, dpr = 1;
  function resize(){
    dpr = window.devicePixelRatio || 1;
    W = cv.parentElement.clientWidth; H = Math.round(Math.min(W*0.58, 560));
    cv.style.height = H + 'px'; cv.width = W*dpr; cv.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  new ResizeObserver(resize).observe(cv.parentElement); resize();

  // --- procedural image: smooth in (x,y), so neighbours look alike ---
  const bayer = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
  function gen(x, y){
    const N = 48, g = new Float32Array(N*N);
    const th = x*6.283, fr = 2 + y*7, ox = (x-.5)*.7, oy = (y-.5)*.7;
    for (let v=0; v<N; v++) for (let u=0; u<N; u++){
      const nu=u/(N-1)-.5, nv=v/(N-1)-.5;
      const w = Math.sin(fr*(nu*Math.cos(th)+nv*Math.sin(th))*6.283*.6 + y*9);
      const r2 = (nu-ox)**2 + (nv-oy)**2;
      const blob = Math.exp(-r2*(10+26*x));
      const hz = 1/(1+Math.exp(-(nv-(y-.5)*.6)*18));
      let val = .5 + .2*w + .55*blob - .28*hz + .12*Math.sin((nu*3+x*5)*(nv*3+y*5)*6);
      g[v*N+u] = val;
    }
    return g;
  }
  const oc = $('out'), octx = oc.getContext('2d');
  function show(g, noisy){
    clearInterval(revealTimer);
    const N = 48, img = octx.createImageData(N,N), n = rng(Date.now()&0xffff);
    for (let v=0; v<N; v++) for (let u=0; u<N; u++){
      let val = g[v*N+u] + (noisy ? (n()-.5)*.12 : 0);
      const on = val*16 < bayer[(v&3)*4+(u&3)] + 0.5 ? 1 : 0; // 1 = ink
      const k = (v*N+u)*4, c = on ? 20 : 236;
      img.data[k]=c; img.data[k+1]=c; img.data[k+2]=on?20:227; img.data[k+3]=255;
    }
    // scanline reveal
    octx.fillStyle = paper; octx.fillRect(0,0,N,N);
    let row = 0;
    revealTimer = setInterval(() => {
      octx.putImageData(img, 0, 0, 0, row, N, 2);
      row += 2; if (row >= N) clearInterval(revealTimer);
    }, 16);
  }
  function clearOut(){ clearInterval(revealTimer); octx.fillStyle=paper; octx.fillRect(0,0,48,48); }
  clearOut();

  // --- language ---
  function parse(q){
    q = q.toLowerCase(); const found = new Set(), unk = [];
    for (const k in ZH) if (q.includes(k)) found.add(TAGS.indexOf(ZH[k]));
    q.split(/[^a-z]+/).filter(Boolean).forEach(w => {
      const s = w.replace(/s$/,'');
      const ti = TAGS.indexOf(w) >= 0 ? TAGS.indexOf(w) : TAGS.indexOf(s);
      if (ti >= 0) found.add(ti); else unk.push(w);
    });
    return { tags:[...found], unk };
  }
  function vecText(q){
    const r = rng(hash(q)), a = [];
    for (let i=0;i<4;i++){ const v=(r()*2-1).toFixed(3); a.push((v>=0?' ':'')+v); }
    const d = DIMS[dimIdx];
    return '[' + a.join(' ') + (d>4 ? ' … +' + (d-4).toLocaleString() : '') + ']';
  }

  // --- actions ---
  function say(m){}
  function verdict(m){ $('verdict').textContent = m; }

  function runQuery(){
    const p = parse(query);
    if (target === 0) {                       // ARCHIVE: catalogue lookup
      probe = null; matched = p.tags;
      if (!query.trim()) { verdict('— no output —'); clearOut(); return; }
      if (!matched.length){
        clearOut(); verdict('NO RECORD.\nThe catalogue has no such heading.');
        say('0 results. An archive answers only what it has filed.');
        $('r-probe').textContent = '—';
      } else {
        const ti = matched[0], pp = pts.filter(q => q.ti===ti)[0];
        show(gen(centers[ti][0], centers[ti][1]), false);
        verdict('RETRIEVED.\nThe original, as filed.');
        say(matched.length*COLS + ' records match “' + matched.map(i=>TAGS[i]).join(' + ') + '”.');
        $('r-probe').textContent = 'index lookup';
      }
    } else {                                  // LATENT: steer
      matched = [];
      if (!query.trim()) { probe = null; verdict('— no output —'); clearOut(); return; }
      let x=0, y=0, n=0;
      p.tags.forEach(i => { x+=centers[i][0]; y+=centers[i][1]; n++; });
      if (!n){ x=.5; y=.5; n=1; }
      const r = rng(hash(query));
      p.unk.forEach(() => { x+=(r()-.5)*.5; y+=(r()-.5)*.5; });
      x /= n; y /= n;
      probe = { x: Math.min(.96,Math.max(.04,x)), y: Math.min(.96,Math.max(.04,y)) };
      extract();
    }
  }
  function extract(){
    const d = 0.03, x = probe.x + (Math.random()-.5)*d, y = probe.y + (Math.random()-.5)*d;
    show(gen(x,y), true);
    verdict('EXTRACTED.\nSampled from the cloud — not an original.');
    say('No map, no catalogue. Run it again: it will not return the same image.');
    $('r-probe').textContent = query ? vecText(query) : vecText(x.toFixed(2)+y.toFixed(2));
  }

  function setMode(m){
    target = m;
    $('bA').classList.toggle('on', m===0); $('bL').classList.toggle('on', m===1);
    $('r-mode').textContent = m ? 'LATENT' : 'ARCHIVE';
    selected = -1; probe = null; matched = [];
    if (query.trim()) runQuery();
    else {
      clearOut(); verdict('— no output —');
      say(m ? 'Absorbed as vectors. Converted to data points. Opaque.' : 'Stored, positioned, made available. Catalogued.');
    }
  }
  $('bA').onclick = () => setMode(0);
  $('bL').onclick = () => setMode(1);

  $('dim').oninput = e => {
    dimIdx = +e.target.value; const d = DIMS[dimIdx];
    $('dimv').textContent = d.toLocaleString(); $('r-dim').textContent = d.toLocaleString();
    if (d >= 4096) say('Beyond perception. One can only think of it as a vast matrix of numbers.');
    else if (d > 3) say(d + ' coordinates per point — this view is a shadow of it.');
    else say('Three coordinates: X, Y, Z. Every object can be placed.');
  };

  $('f').onsubmit = e => { e.preventDefault(); query = $('q').value; runQuery(); };
  const chips = $('chips');
  TAGS.forEach(w => { const b=document.createElement('button'); b.type='button'; b.textContent=w;
    b.onclick = () => { const q=$('q'); q.value = (q.value.trim()+' '+w).trim(); query=q.value; runQuery(); }; chips.appendChild(b); });

  // --- pointer ---
  let POS = [];
  function mouse(e){ const r = cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; }
  function nearest(mx,my,maxd){
    let b=-1, bd=maxd*maxd;
    for (let i=0;i<POS.length;i++){ const dx=POS[i][0]-mx, dy=POS[i][1]-my, d=dx*dx+dy*dy; if (d<bd){bd=d;b=i;} }
    return b;
  }
  cv.addEventListener('mousemove', e => {
    const [mx,my] = mouse(e); hover = nearest(mx,my,14);
    $('r-hover').textContent = hover<0 ? '—' :
      (target===0 ? pts[hover].id : '[' + [pts[hover].lx,pts[hover].ly].map(v=>(v*2-1).toFixed(3)).join(' ') + ' …]');
  });
  cv.addEventListener('mouseleave', () => { hover=-1; $('r-hover').textContent='—'; });
  cv.addEventListener('click', e => {
    const [mx,my] = mouse(e);
    if (target === 0){
      const i = nearest(mx,my,14); if (i<0) { say('Nothing is filed there.'); return; }
      selected = i; probe = null; matched = [];
      show(gen(pts[i].lx, pts[i].ly), false);
      verdict('RETRIEVED.\n' + pts[i].id + ', exactly as filed.');
      say('An archive hands back the thing itself.'); $('r-probe').textContent = pts[i].id;
    } else {
      probe = { x: mx/W, y: my/H }; query = ''; $('q').value='';
      extract();
    }
  });

  // --- render ---
  const ease = x => x<.5 ? 2*x*x : 1-Math.pow(-2*x+2,2)/2;
  let nums = [], numT = 0;
  function frame(ts){
    t += (target - t) * 0.07; if (Math.abs(target-t)<.001) t = target;
    const e = ease(t), fog = dimIdx/5, time = ts/1000;
    ctx.fillStyle = paper; ctx.fillRect(0,0,W,H);

    // matrix of numbers (appears as dimensions grow)
    if (fog > 0 && t > .3){
      if (ts - numT > 140){ numT = ts; nums = []; for (let i=0;i<Math.ceil(W/40)*Math.ceil(H/16);i++) nums.push((Math.random()*2-1).toFixed(2)); }
      ctx.font = '10px ui-monospace,Menlo,monospace'; ctx.fillStyle = ink; ctx.globalAlpha = fog*t*.22;
      const cols = Math.ceil(W/40); nums.forEach((s,i) => ctx.fillText(s, (i%cols)*40+4, Math.floor(i/cols)*16+12));
      ctx.globalAlpha = 1;
    }

    // archive scaffolding
    if (t < .9){
      ctx.globalAlpha = 1 - t/.9; ctx.fillStyle = ink; ctx.font = '10px ui-monospace,Menlo,monospace';
      TAGS.forEach((tg,i) => ctx.fillText(tg.toUpperCase(), 8, (0.07+0.87*i/(ROWS-1))*H+3));
      ctx.fillRect(0.115*W, 0.02*H, 1, 0.96*H);
      ctx.fillText('001', 0.13*W-8, H-3); ctx.fillText('032', 0.97*W-14, H-3);
      ctx.globalAlpha = 1;
    }
    // axes (3 dims)
    if (dimIdx===0 && t>.4){
      ctx.globalAlpha = (t-.4)/.6; ctx.fillStyle = ink; ctx.strokeStyle = ink; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(14,H-14); ctx.lineTo(14,H-54); ctx.moveTo(14,H-14); ctx.lineTo(54,H-14); ctx.moveTo(14,H-14); ctx.lineTo(36,H-34); ctx.stroke();
      ctx.font='10px ui-monospace,Menlo,monospace'; ctx.fillText('Y',8,H-58); ctx.fillText('X',58,H-10); ctx.fillText('Z',38,H-34);
      ctx.globalAlpha=1;
    }

    // positions
    POS = pts.map((p,i) => {
      let x = p.ax+(p.lx-p.ax)*e, y = p.ay+(p.ly-p.ay)*e;
      const wob = Math.sin(Math.PI*t)*.012;
      x += Math.sin(time*1.7+p.ph)*wob; y += Math.cos(time*1.3+p.ph)*wob;
      const f = fog*t*.045;
      x += Math.sin(time*2.3+p.ph*3)*f + (Math.sin(time*.4+p.ph)*.004)*t;
      y += Math.cos(time*2.1+p.ph*2)*f*1.3 + (Math.cos(time*.5+p.ph)*.004)*t;
      return [x*W, y*H];
    });

    // neighbours of the probe
    let near = [];
    if (probe && target===1){
      const px=probe.x*W, py=probe.y*H;
      near = POS.map((q,i)=>[Math.hypot(q[0]-px,q[1]-py),i]).sort((a,b)=>a[0]-b[0]).slice(0,7);
      ctx.strokeStyle = ink; ctx.lineWidth = 1; ctx.setLineDash([2,3]);
      near.forEach(([d,i]) => { ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(POS[i][0],POS[i][1]); ctx.stroke(); });
      ctx.setLineDash([]);
      $('r-near').textContent = near.length;
    } else $('r-near').textContent = target===0 ? matched.length*COLS : 0;
    const nearSet = new Set(near.map(n=>n[1]));

    // points
    pts.forEach((p,i) => {
      const [x,y] = POS[i];
      const hit = (target===0 && (matched.includes(p.ti) || selected===i)) || nearSet.has(i);
      ctx.fillStyle = ink;
      if (hit){ ctx.fillRect(x-3,y-3,6,6); ctx.fillStyle = paper; ctx.fillRect(x-1,y-1,2,2); }
      else { ctx.globalAlpha = (matched.length && target===0) ? .25 : 1; ctx.fillRect(x-1.2,y-1.2,2.4,2.4); ctx.globalAlpha=1; }
    });
    if (hover>=0){
      const [x,y]=POS[hover]; ctx.strokeStyle=ink; ctx.lineWidth=1.5; ctx.strokeRect(x-6.5,y-6.5,13,13);
      if (target===0){ ctx.font='11px ui-monospace,Menlo,monospace'; const s=pts[hover].id, w=ctx.measureText(s).width+10;
        const bx=Math.min(W-w-4,x+10), by=Math.max(4,y-24); ctx.fillStyle=ink; ctx.fillRect(bx,by,w,16); ctx.fillStyle=paper; ctx.fillText(s,bx+5,by+12); }
    }

    // probe crosshair
    if (probe && target===1){
      const px=probe.x*W, py=probe.y*H; ctx.strokeStyle=ink; ctx.lineWidth=1;
      const k = 7 + Math.sin(time*5)*1.5;
      ctx.beginPath(); ctx.moveTo(px-14,py); ctx.lineTo(px-k,py); ctx.moveTo(px+k,py); ctx.lineTo(px+14,py);
      ctx.moveTo(px,py-14); ctx.lineTo(px,py-k); ctx.moveTo(px,py+k); ctx.lineTo(px,py+14); ctx.stroke();
      ctx.beginPath(); ctx.arc(px,py,3,0,6.283); ctx.fill();
    }

    // label for latent mode
    if (t > .7){ ctx.globalAlpha = (t-.7)/.3*.9; ctx.fillStyle = ink; ctx.font='10px ui-monospace,Menlo,monospace';
      ctx.fillText('NO CATALOGUE · NO MAP', W-142, 14); ctx.globalAlpha=1; }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // misc
  $('cnt').textContent = pts.length + ' RECORDS';
  setInterval(() => { const d=new Date(); $('clock').textContent = d.toTimeString().slice(0,5); }, 1000);
  $('clock').textContent = new Date().toTimeString().slice(0,5);
  $('dimv').textContent = '3'; $('r-dim').textContent = '3';
})();
</script>
</body>
</html>
